
name: ETL Pipeline Casa Curadoria

on:
  # Permite que você rode o script manualmente apertando um botão no GitHub
  workflow_dispatch:
  # Roda automaticamente todo dia às 03:00 da manhã (horário UTC)
  schedule:
    - cron: '0 3 * * *'

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer checkout do repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar o script principal
      env:
        # Passa os segredos do GitHub para o Python ler
        META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
      run: python main.py

    - name: Fazer commit do resultado atualizado
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/Analise_Posts_Dashboard.csv
        # Tenta commitar. Se não houver mudanças, ele ignora silenciosamente.
        git commit -m "Automated update: Dashboard CSV" || echo "Nenhuma mudança para commitar"
        git push
